stages: [quality]
quality:
  stage: quality
  image: $PYTHON_IMAGE
  parallel:
    matrix:
      - PYTHON_IMAGE: ["python:3.11", "python:3.12", "python:3.13"]
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e '.[dev,models,reviewer,paper,benchmark]' -e GIDInd/python_port
  script: [scripts/ci.sh]
  artifacts:
    when: always
    paths: [dist/*.whl]
